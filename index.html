    <script>
      (function() {
        try {
          var _origFetch = typeof window.fetch === 'function' ? window.fetch.bind(window) : undefined;
          Object.defineProperty(window, 'fetch', {
            get: function() { return _origFetch; },
            set: function(val) { _origFetch = val; },
            configurable: true,
            enumerable: true
          });
        } catch (e) {}

        window.addEventListener('error', function(event) {
          if (event.filename && event.filename.indexOf('chrome-extension://') !== -1) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
